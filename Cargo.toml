[workspace]
resolver = "3"
members = [
    "platform/alo-store",
    "platform/alo-identity",
    "platform/alo-auth-mail",
    "platform/alo-sieve",
    "platform/alo-ai",
    "platform/alo-pdf",
    "products/mail/alo-smtp",
    "products/mail/alo-smtp-client",
    "products/mail/alo-imap",
    "products/mail/alo-jmap",
    "migrate",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "fs", "sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
# Gzip for DMARC aggregate reports (RFC 7489 §7.2.1.1) — pure-Rust
# backend (miniz_oxide), no C.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Async MX/A/AAAA resolution for outbound delivery (RFC 5321 §5.1).
# Pinned ≥0.26.1: earlier hickory-proto carries RUSTSEC-2026-0119.
hickory-resolver = { version = "0.26", features = ["dnssec-ring"] }
# TLS via rustls with the ring provider (pure Rust, no OpenSSL/C — see
# ADR/doctrine "Rust below the waterline"). tls12 for broad client
# compatibility; STARTTLS (RFC 3207) and implicit TLS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# PEM cert/key loading via pki-types (rustls-pemfile is unmaintained,
# RUSTSEC-2025-0134; its functionality moved here).
rustls-pki-types = { version = "1", features = ["std"] }
# Self-signed cert generation for dev/test when no PEM is configured.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Base64 for SASL AUTH (RFC 4954) and DKIM (RFC 6376) tags.
base64 = "0.22"
# MIME parsing for inbound message bodies + attachments (RFC 2045/2046/2047):
# multipart walking, transfer-encoding + charset decoding. Reading incoming
# mail correctly is a parser's job, not something to hand-roll.
mail-parser = "0.11"
# HTTP client for the AI inference layer (alo-ai) — calling an operator-set
# OpenAI-compatible endpoint (Ollama/vLLM/hosted) needs real TLS + response
# handling. rustls only (no OpenSSL), matching our TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Browser-grade charset decoding for RFC 2047 encoded-word header values.
encoding_rs = "0.8"
# Drive content search (ADR 0029): pull searchable text out of binary files.
# Office (docx/xlsx/pptx) is ZIP-of-XML — `zip` (pure Rust; deflate via the
# in-tree flate2 backend) opens the archive, `quick-xml` walks the parts; PDF
# via `pdf-extract`'s text layer. All pure Rust (no C), below the waterline.
# Extraction runs in spawn_blocking so a malformed file can never stall or
# crash the store — a parser panic just means "not content-indexed".
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
pdf-extract = "0.7"
# Trust-stack (alo-auth-mail) crypto primitives. RSA sign/verify use
# `ring` (constant-time, already in-tree via rustls) rather than the
# `rsa` crate, which carries the unfixed Marvin timing sidechannel
# (RUSTSEC-2023-0071). Ed25519 (DKIM RFC 8463) via ed25519-dalek;
# SHA-256 via ring; zeroizing key buffers via zeroize.
ring = "0.17"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
sha2 = "0.10"
hmac = "0.12"
zeroize = "1"
# Auditable constant-time byte comparison for alo-identity's secret and
# token-hash checks (ring's own helper is deprecated as "no side-channel
# promises"). `subtle` is the canonical, purpose-built primitive.
subtle = "2"
# Public-suffix list for DMARC organizational-domain discovery
# (RFC 7489 §3.2); the crate embeds a compiled list (no runtime fetch).
psl = "2"
# alo-store: PostgreSQL (system of record) via sqlx with
# compile-checked queries; rustls (no OpenSSL). Timestamps map through
# the `time` crate at the DB boundary. Blobs go through the
# `object_store` abstraction; the default build carries only its lean
# in-memory/local core, and the S3 (Garage) client — which pulls the
# reqwest/quick-xml tree — is gated behind alo-store's `garage`
# feature (see docs/decisions/0006). `bytes` for zero-copy blob buffers.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time"] }
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
object_store = { version = "0.11", default-features = false }
bytes = "1"
# alo-identity: argon2id password hashing (the credential authority).
# See docs/design/identity.md and docs/decisions/0008.
argon2 = "0.5"
# alo-jmap: the JMAP HTTP service (RFC 8620/8621). axum over hyper
# (already in-tree) for routing, JSON, and Server-Sent-Events push;
# `futures` for the SSE stream.
axum = "0.8"
futures = "0.3"
# alo-sites tests: drive the router in-process (`ServiceExt::oneshot`) so
# Host-isolation is proven against the real service without a socket.
tower = { version = "0.5", default-features = false, features = ["util"] }

# CLAUDE.md law 2 enforced by the compiler: stubs and swallowed panics
# cannot merge because they cannot compile under `clippy -D warnings`.
[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
