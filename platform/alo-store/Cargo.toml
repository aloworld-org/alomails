[package]
name = "alo-store"
description = "alo message store: tenant-scoped mailboxes, messages, flags, threads, and blobs on PostgreSQL + Garage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reading stored mail: the display body and the attachment list out of a
# raw RFC 5322 message. Lives here rather than in a protocol crate because
# JMAP, IMAP and MAPI all serve the same stored bytes, and a second parser
# would be a second answer to what a message says.
mail-parser = { workspace = true }
alo-sieve = { path = "../alo-sieve" }
alo-auth-mail = { path = "../alo-auth-mail" }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
# Contact multi-value fields (emails/phones) serialize to the JSONB columns
# and to the JMAP/vCard surfaces.
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
# IANA timezone database, for converting TZID-qualified iCalendar times to UTC
# (already a vetted workspace dependency — alo-auth-mail, alo-smtp).
jiff = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
encoding_rs = { workspace = true }
argon2 = { workspace = true }
# Text extraction from binary files for Drive content search (see extract.rs).
zip = { workspace = true }
quick-xml = { workspace = true }
pdf-extract = { workspace = true }

[features]
# The Garage (S3) blob backend. Off by default: it pulls object_store's
# cloud client (reqwest + quick-xml). The in-memory backend and all store
# logic build without it (see docs/decisions/0006).
garage = ["object_store/aws"]

[dev-dependencies]
# The one place a suite learns which database it may use: it refuses
# the database the product runs on (CLAUDE.md, one-database rule).
alo-test-db = { path = "../../platform/alo-test-db" }
tokio = { workspace = true }
time = { workspace = true }
# Purge assertions read rows directly: the public list APIs may lazily
# re-create defaults, which a deleted tenant can no longer satisfy.
sqlx = { workspace = true }
# A missing blob is reported only in the log — the caller is told the same
# NotFound either way — so reading the log is the only way to hold that line.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
