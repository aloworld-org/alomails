# LiveKit configuration for the alo development/CI compose stack.
# The key pair below is a development placeholder — production keys
# are minted per deployment and injected via the control plane
# (ROADMAP.md Phase 2, "LiveKit deployed; token minting from alo
# identities").
port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50019
  use_external_ip: false
keys:
  alo-dev-key: alo-dev-secret-placeholder-not-for-production
logging:
  level: info
