[package]
name = "alo-jmap"
description = "alo JMAP API (RFC 8620 core, RFC 8621 mail) over alo-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alo-store = { path = "../../../platform/alo-store" }
alo-sieve = { path = "../../../platform/alo-sieve" }
alo-identity = { path = "../../../platform/alo-identity" }
# MAPI-over-HTTP for native Outlook (ADR 0051); mounted only when enabled.
alo-mapi = { path = "../alo-mapi" }
# The PDF writer behind GET /billing/{invoices,quotes}/{id}/pdf (B1.17): the
# printed document rendered a second way, from the same document model.
alo-pdf = { path = "../../../platform/alo-pdf" }
# The shared outbound SMTP client — EmailSubmission/set sends through the
# trusted internal submission listener using the same production client the
# SMTP delivery path uses.
alo-smtp-client = { path = "../alo-smtp-client" }
# The AI inference layer (ADR 0011) — the /ai/improve route bridges to it.
alo-ai = { path = "../../../platform/alo-ai" }
# The Sites render library (ADR 0036): the authenticated draft preview is
# rendered by the exact renderer the public alo-sites service serves, so
# preview and production HTML cannot drift.
alo-sites = { path = "../../sites/alo-sites" }
# Per-domain DKIM key generation when a domain is verified (ADR 0014).
alo-auth-mail = { path = "../../../platform/alo-auth-mail" }
# Live DNS checks for the admin Security & trust page (SPF/DMARC/DKIM/MX/PTR).
hickory-resolver = { workspace = true }
# The MTA-STS policy fetch (HTTPS) in the Security & trust checks.
reqwest = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
bytes = { workspace = true }
# RFC 2047 encoded-words + base64 message bodies for outgoing mail.
base64 = { workspace = true }
# HMAC-signed, stateless WOPI access tokens for the Collabora office editor.
sha2 = { workspace = true }
hmac = { workspace = true }
# Outbound IMAP client for the Gmail/Outlook import wizard: implicit-TLS
# (rustls + ring, no OpenSSL) with real cert verification against the
# Mozilla roots — the user's credentials go over this wire.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = "0.26"
# MIME parsing for inbound bodies + attachments (Email/get, download).
mail-parser = { workspace = true }

[dev-dependencies]
# Reads our own PDF output back with an independent parser, so a rendering
# test asserts what a reader sees rather than what we wrote (B1.17).
pdf-extract = { workspace = true }
tokio = { workspace = true }
# In-process HTTP testing (drive the router without a socket) + a small
# test pool.
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
