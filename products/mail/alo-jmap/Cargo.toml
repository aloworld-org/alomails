[package]
name = "alo-jmap"
description = "alo JMAP API (RFC 8620 core, RFC 8621 mail) over alo-store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Integration tests are consolidated into a handful of suite binaries (the
# [[test]] targets below); autodiscovery would build every tests/*.rs as its
# own crate root beside them.
autotests = false
build = "build.rs"

[dependencies]
alo-store = { path = "../../../platform/alo-store" }
alo-sieve = { path = "../../../platform/alo-sieve" }
alo-identity = { path = "../../../platform/alo-identity" }
# MAPI-over-HTTP for native Outlook (ADR 0051); mounted only when enabled.
# The PDF writer behind GET /billing/{invoices,quotes}/{id}/pdf (B1.17): the
# printed document rendered a second way, from the same document model.
alo-pdf = { path = "../../../platform/alo-pdf" }
# The shared outbound SMTP client — EmailSubmission/set sends through the
# trusted internal submission listener using the same production client the
# SMTP delivery path uses.
alo-smtp-client = { path = "../alo-smtp-client" }
# The one path a composed message takes out of alo: the send-as check,
# the Bcc strip and the post-send filing, shared with MAPI.
alo-submit = { path = "../alo-submit" }
# The AI inference layer (ADR 0011) — the /ai/improve route bridges to it.
alo-ai = { path = "../../../platform/alo-ai" }
# The Sites render library (ADR 0036): the authenticated draft preview is
# rendered by the exact renderer the public alo-sites service serves, so
# preview and production HTML cannot drift.
alo-sites = { path = "../../sites/alo-sites" }
# Per-domain DKIM key generation when a domain is verified (ADR 0014).
alo-auth-mail = { path = "../../../platform/alo-auth-mail" }
# Live DNS checks for the admin Security & trust page (SPF/DMARC/DKIM/MX/PTR).
hickory-resolver = { workspace = true }
# The MTA-STS policy fetch (HTTPS) in the Security & trust checks.
reqwest = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
time = { workspace = true }
bytes = { workspace = true }
# RFC 2047 encoded-words + base64 message bodies for outgoing mail.
base64 = { workspace = true }
# HMAC-signed, stateless WOPI access tokens for the Collabora office editor.
sha2 = { workspace = true }
hmac = { workspace = true }
# Web Push (mail M5.3): VAPID ES256 tokens (RFC 8292) and aes128gcm payload
# encryption toward the browser (RFC 8291) — ECDH, HKDF and AES-GCM all from
# the one crypto crate the platform already trusts.
ring = { workspace = true }
# Outbound IMAP client for the Gmail/Outlook import wizard: implicit-TLS
# (rustls + ring, no OpenSSL) with real cert verification against the
# Mozilla roots — the user's credentials go over this wire.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = "0.26"
# MIME parsing for inbound bodies + attachments (Email/get, download).
mail-parser = { workspace = true }
# A quotation's pictures made placeable in its PDF (quote_design_images):
# PNG/WebP decoded and written as JPEG, the one format alo-pdf places. The
# same decoder Sites already trusts for its image derivatives.
image = { workspace = true }

[dev-dependencies]
# The one place a suite learns which database it may use: it refuses
# the database the product runs on (CLAUDE.md, one-database rule).
alo-test-db = { path = "../../../platform/alo-test-db" }
# Reads our own PDF output back with an independent parser, so a rendering
# test asserts what a reader sees rather than what we wrote (B1.17).
pdf-extract = { workspace = true }
tokio = { workspace = true }
# In-process HTTP testing (drive the router without a socket) + a small
# test pool.
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# One binary per test area instead of one per file: ~110 per-file binaries
# took most of an hour to relink after any crate change. The suite roots
# declare the same files as modules; nothing about the tests themselves
# changed.
[[test]]
name = "agents_http_suite"
path = "tests/agents_http_suite.rs"

[[test]]
name = "billing_http_suite"
path = "tests/billing_http_suite.rs"

[[test]]
name = "business_http_suite"
path = "tests/business_http_suite.rs"

[[test]]
name = "mail_http_suite"
path = "tests/mail_http_suite.rs"

[[test]]
name = "sites_http_suite"
path = "tests/sites_http_suite.rs"
