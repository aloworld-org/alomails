[package]
name = "alo-mapi"
description = "alo MAPI-over-HTTP transport for native Outlook ([MS-OXCMAPIHTTP], ADR 0051)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alo-store = { path = "../../../platform/alo-store" }
alo-identity = { path = "../../../platform/alo-identity" }
# The endpoints mount into the same axum router as the rest of the mail surface.
axum = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Session-context cookies are opaque random strings, never guessable ids.
# `ring`'s CSPRNG, matching how alo-identity mints secrets — one randomness
# source in the codebase rather than a second opinion about what is random.
ring = { workspace = true }
# Basic authentication over TLS ([MS-OXCMAPIHTTP] uses ordinary HTTP auth).
base64 = { workspace = true }
# Response bodies are little-endian binary structures.
bytes = { workspace = true }
# Session-context expiry.
time = { workspace = true }

[dev-dependencies]
# The one place a suite learns which database it may use: it refuses
# the database the product runs on (CLAUDE.md, one-database rule).
alo-test-db = { path = "../../../platform/alo-test-db" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
# A live store for the handshake tests: the credential door and the tenant
# boundary are the things under test, so neither is stubbed.
sqlx = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
